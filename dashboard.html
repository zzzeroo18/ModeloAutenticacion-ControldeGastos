<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Dashboard de Gastos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <span id="user-display"></span>
        <button id="theme-toggle" aria-label="Cambiar tema">Modo Claro/Oscuro</button>
        <button id="btn-logout" class="btn-secondary">Cerrar Sesión</button>
    </header>

    <main class="dashboard-container">
        <h1>Gestión de Gastos</h1>

        <section class="card summary-card">
            <h2>Total Gastado</h2>
            <p id="total-monto" class="total-amount">$ 0,00</p>
        </section>
        <section class="card">
            <h2 id="form-title">Cargar Nuevo Gasto</h2>
            <form id="gasto-form">
                <input type="hidden" id="gasto-id">
                
                <div class="form-group">
                    <label for="monto">Monto ($):</label>
                    <input type="number" id="monto" step="0.01" min="0.01" required placeholder="Ej: 1500.50">
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" required>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" required>
                        <option value="" disabled selected>Seleccione una categoría</option>
                        <option value="Alimentación">Alimentación</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Servicios">Servicios</option>
                        <option value="Ocio">Ocio</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción:</label>
                    <input type="text" id="descripcion" required placeholder="Ej: Compras del supermercado">
                </div>

                <button type="submit" id="btn-guardar-gasto" class="btn-main">Guardar Gasto</button>
                <button type="button" id="btn-cancelar-edit" class="btn-secondary" style="display: none;">Cancelar Edición</button>
            </form>
            <div id="gasto-msg" role="alert"></div>
        </section>

        <section class="card table-card">
            <h2>Historial de Gastos</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Categoría</th>
                            <th>Descripción</th>
                            <th>Monto</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-gastos-body">
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <dialog id="delete-modal" class="modal">
        <div class="modal-content">
            <h3>Confirmar Eliminación</h3>
            <p>¿Está seguro de que desea eliminar este gasto? Esta acción lo inactivará del sistema.</p>
            <div class="modal-actions">
                <button id="btn-confirm-delete" class="btn-danger">Eliminar</button>
                <button id="btn-cancel-delete" class="btn-secondary">Cancelar</button>
            </div>
        </div>
    </dialog>

    <script src="main.js"></script>
    <script src="gastos.js"></script>
</body>
</html>
