<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button id="theme-toggle" aria-label="Cambiar tema">Modo Claro/Oscuro</button>
    </header>
    <main class="card">
        <h1>SGG - Iniciar Sesión</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <div class="password-wrapper">
                    <input type="password" id="password" required autocomplete="current-password">
                    <button type="button" class="toggle-password" data-target="password" aria-label="Ver u ocultar contraseña">🔒</button>
                </div>
            </div>
            <button type="submit" id="btn-login">Ingresar</button>
        </form>
        <div id="msg" role="alert"></div>
        <div class="links">
            <a href="registro.html">¿No tenés cuenta? Registrate</a><br>
            <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
        </div>
    </main>
    <script src="main.js"></script>
    <script src="login.js"></script>
</body>
</html>
