<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Recuperar Contraseña</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button id="theme-toggle" aria-label="Cambiar tema">Modo Claro/Oscuro</button>
    </header>
    <main class="card">
        <h1>Cambiar Contraseña</h1>
        <form id="rec-form">
            <div class="form-group">
                <label for="rec-email">Email Registrado:</label>
                <input type="email" id="rec-email" required>
            </div>
            <div class="form-group">
                <label for="new-password">Nueva Contraseña:</label>
                <div class="password-wrapper">
                    <input type="password" id="new-password" required>
                    <button type="button" class="toggle-password" data-target="new-password" aria-label="Ver u ocultar contraseña">🔒</button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirm-new-password">Repetir Nueva Contraseña:</label>
                <div class="password-wrapper">
                    <input type="password" id="confirm-new-password" required>
                    <button type="button" class="toggle-password" data-target="confirm-new-password" aria-label="Ver u ocultar contraseña">🔒</button>
                </div>
            </div>
            <button type="submit" id="btn-rec">Actualizar Contraseña</button>
        </form>
        <div id="rec-msg" role="alert"></div>
        <div class="links">
            <a href="index.html">Volver al Login</a>
        </div>
    </main>
    <script src="main.js"></script>
    <script src="recuperar.js"></script>
</body>
</html>
